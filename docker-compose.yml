# Docker Compose pour Time-Swap Network
# J'ai appris Docker récemment, c'est pratique pour le déploiement !

version: '3.8'

services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: timeswap
      POSTGRES_USER: timeswap
      POSTGRES_PASSWORD: timeswap123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - timeswap-network

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://timeswap:timeswap123@database:5432/timeswap"
      JWT_SECRET: "your-super-secret-jwt-key-for-production"
    depends_on:
      - database
    networks:
      - timeswap-network
    # Pour le développement, on peut monter le code
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    depends_on:
      - backend
    networks:
      - timeswap-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

networks:
  timeswap-network:
    driver: bridge
